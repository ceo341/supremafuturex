<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM & Pipeline Lead — Suprema Future X</title>
  
  <meta name="theme-color" content="#0f1319" />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            silverMatte: { DEFAULT: '#0f1319', surface: '#161c24', border: '#28313d', light: '#e2e8f0' },
            gold: { DEFAULT: '#d4af37', light: '#f3e5ab' },
            cyanLaser: { DEFAULT: '#00f0ff', dim: '#008b94' }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            mono: ['Space Grotesk', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f1319; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; }
    .gold-glow { border: 1px solid rgba(212, 175, 55, 0.4); box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
    .cyan-glow { border: 1px solid rgba(0, 240, 255, 0.4); box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f1319; }
    ::-webkit-scrollbar-thumb { background: #28313d; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-cyanLaser selection:text-black">

  <!-- HEADER CRM -->
  <header class="bg-silverMatte-surface border-b border-cyanLaser/30 px-6 py-4 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full border border-cyanLaser flex items-center justify-center bg-silverMatte font-cinzel font-bold text-cyanLaser text-sm shadow-[0_0_12px_rgba(0,240,255,0.3)]">
        CRM
      </div>
      <div>
        <h1 class="font-cinzel text-lg font-bold text-white tracking-wider">PIPELINE &amp; LEAD MANAGER</h1>
        <p class="text-[10px] text-gold font-mono uppercase tracking-widest">Suprema Future X — Executive Desk</p>
      </div>
    </div>
    <div class="flex items-center space-x-3 text-xs font-mono">
      <button onclick="fetchCRMData()" class="px-3 py-1.5 rounded-xl bg-cyanLaser/20 text-cyanLaser border border-cyanLaser/40 hover:bg-cyanLaser hover:text-black transition">
        <i class="fa-solid fa-arrows-rotate mr-1"></i> Ricarica Dati
      </button>
      <a href="index.html" class="px-3 py-1.5 rounded-xl border border-silverMatte-border text-gray-300 hover:text-white hover:bg-silverMatte-border transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Landing
      </a>
    </div>
  </header>

  <!-- CONTENUTO CRM -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-6">

    <!-- BARRA RICERCA E FILTRI -->
    <div class="bg-silverMatte-surface p-4 rounded-2xl border border-silverMatte-border flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center space-x-2 w-full sm:w-auto flex-grow max-w-md">
        <i class="fa-solid fa-search text-gray-400"></i>
        <input type="text" id="crm-search" oninput="filterCRMTable()" placeholder="Cerca per Nome, Codice NEXUS o Email..." class="w-full bg-silverMatte border border-silverMatte-border rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-cyanLaser font-mono">
      </div>
      <div class="text-xs font-mono text-gray-400">
        Totale Lead In Cassa: <strong id="total-count" class="text-cyanLaser">0</strong>
      </div>
    </div>

    <!-- TABELLA PIPELINE LEAD -->
    <div class="bg-silverMatte-surface rounded-2xl border border-silverMatte-border overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs font-mono text-gray-300">
          <thead class="bg-silverMatte uppercase text-gray-400 border-b border-silverMatte-border">
            <tr>
              <th class="p-3">Data Registrazione</th>
              <th class="p-3">Codice NEXUS</th>
              <th class="p-3">Nominativo &amp; Città</th>
              <th class="p-3">Contatti</th>
              <th class="p-3">Slot Riservato</th>
              <th class="p-3">Punti Gold</th>
              <th class="p-3 text-right">Azioni Rapide</th>
            </tr>
          </thead>
          <tbody id="crm-table-body" class="divide-y divide-silverMatte-border">
            <tr>
              <td colspan="7" class="p-6 text-center text-gray-500 italic">Caricamento dati CRM in corso...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwysaZ7XC63ChZN9D311SYr_s55Yg4cX1-5hZqM7irKspXQExlYEqKMhbpWgKWzIXy7Gw/exec";
    var crmData = [];

    async function fetchCRMData() {
      try {
        var res = await fetch(`${APPS_SCRIPT_URL}?action=GET_LEADS`);
        var json = await res.json();
        if (json.leads) {
          crmData = json.leads;
          renderCRMTable(crmData);
        }
      } catch (err) {
        console.error("Errore fetch CRM:", err);
      }
    }

    function renderCRMTable(data) {
      var tbody = document.getElementById('crm-table-body');
      document.getElementById('total-count').innerText = data.length;
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-500">Nessun lead registrato al momento.</td></tr>';
        return;
      }

      data.forEach(function(l) {
        var tr = document.createElement('tr');
        var cleanPhone = (l.phone || '').replace(/[^0-9]/g, '');
        tr.innerHTML = `
          <td class="p-3 text-gray-400">${l.timestamp || '-'}</td>
          <td class="p-3 text-cyanLaser font-bold">${l.nexus || l.nexus_code}</td>
          <td class="p-3 text-white font-bold">${l.name} <br><span class="text-gray-500 font-normal">📍 ${l.city}</span></td>
          <td class="p-3">${l.email} <br><span class="text-gray-400">${l.phone}</span></td>
          <td class="p-3 text-gold">${l.date} <br><span class="text-gray-400">${l.slot}</span></td>
          <td class="p-3 font-bold text-emerald-400">+${l.points || 50} PTS</td>
          <td class="p-3 text-right space-x-1">
            <a href="https://wa.me/${cleanPhone}" target="_blank" class="px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black transition" title="WhatsApp">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="mailto:${l.email}" class="px-2 py-1 rounded bg-cyanLaser/20 text-cyanLaser hover:bg-cyanLaser hover:text-black transition" title="Invia Email">
              <i class="fa-solid fa-envelope"></i>
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterCRMTable() {
      var query = document.getElementById('crm-search').value.toLowerCase();
      var filtered = crmData.filter(function(l) {
        return (l.name || '').toLowerCase().includes(query) ||
               (l.nexus || '').toLowerCase().includes(query) ||
               (l.email || '').toLowerCase().includes(query) ||
               (l.city || '').toLowerCase().includes(query);
      });
      renderCRMTable(filtered);
    }

    // Caricamento automatico all'apertura della pagina
    fetchCRMData();
  </script>
</body>
</html>
