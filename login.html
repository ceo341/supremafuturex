<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINALE RISERVATO // X-BOX CEO & PRIVATO CEO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#090A0D] text-white min-h-screen flex items-center justify-center p-4 font-mono">

    <div class="w-full max-w-md bg-[#121620] border-2 border-yellow-600 rounded-3xl p-8 shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-full bg-black p-1 border-2 border-cyan-500 animate-pulse">
            <img src="media/logo.png" alt="Logo" class="w-full h-full rounded-full object-cover">
        </div>

        <h2 id="login-title" class="font-bold text-base text-yellow-400 uppercase tracking-widest">
            BENVENUTO NELLA X-BOX CEO INSERIRE PASSWORD
        </h2>

        <!-- FASE 1: PASSWORD -->
        <div id="fase-password" class="space-y-4">
            <input type="password" id="input-pass" placeholder="Password CEO..." class="w-full p-3.5 bg-black border border-gray-700 rounded-xl text-center font-bold text-xs outline-none focus:border-yellow-500">
            <button onclick="verificaPassword()" class="w-full py-3.5 bg-yellow-600 text-black font-extrabold rounded-xl uppercase text-xs hover:bg-yellow-500">
                Verifica Password
            </button>
        </div>

        <!-- FASE 2: PIN -->
        <div id="fase-pin" class="space-y-4 hidden">
            <p class="text-xs text-cyan-400 font-bold">PASSWORD CONFERMATA. INSERIRE PIN DI VERIFICA (10 CIFRE):</p>
            <input type="password" id="input-pin" maxlength="10" placeholder="••••••••••" class="w-full p-3.5 bg-black border border-cyan-500 rounded-xl text-center font-bold text-xs outline-none">
            <button onclick="verificaPIN()" class="w-full py-3.5 bg-cyan-500 text-black font-extrabold rounded-xl uppercase text-xs hover:bg-cyan-400">
                Sblocca Accesso
            </button>
        </div>

        <div id="status-msg" class="text-xs font-bold min-h-[20px]"></div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzegxbf4ZpkJkrb4NVJsTlYmfles9jW9VTw0hv8JWRdF6251ag3SKBGVq-eR1rfvwBQ3g/exec';
        let tentativi = 0;

        function emettiSuonoMetallico() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        async function inviaReportAbuso() {
            try {
                await fetch(APPS_SCRIPT_URL, {
                  method: 'POST',
                  body: JSON.stringify({ action: 'SECURITY_ALERT', message: 'Attenzione entrata non autorizzata alla X-BOX' })
                });
            } catch(e) {}
        }

        function verificaPassword() {
            const pass = document.getElementById('input-pass').value.trim();
            const msg = document.getElementById('stato-msg') || document.getElementById('status-msg');

            if (pass === 'MARIACHIARA supremaofficial2026@') {
                msg.className = 'text-green-400 font-bold';
                msg.textContent = '✓ PASSWORD VALIDA. INSERIRE PIN DI VERIFICA.';
                document.getElementById('fase-password').classList.add('hidden');
                document.getElementById('fase-pin').classList.remove('hidden');
            } else {
                tentativi++;
                msg.className = 'text-red-500 font-bold';
                msg.textContent = `✗ PASSWORD ERRATA (${tentativi}/3)`;

                if (tentativi >= 3) {
                    emettiSuonoMetallico();
                    inviaReportAbuso();
                    alert("ATTENZIONE: ENTRATA NON AUTORIZZATA. REPORT SICUREZZA INVIATO AL CEO.");
                    window.location.href = 'index.html';
                }
            }
        }

        function verificaPIN() {
            const pin = document.getElementById('input-pin').value.trim();
            const msg = document.getElementById('status-msg');

            if (pin === '3474429091') {
                msg.className = 'text-cyan-400 font-bold';
                msg.textContent = 'verifica completata grazie ceo buon lavoro';
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                setTimeout(() => {
                    window.location.href = 'vault.html';
                }, 1200);
            } else {
                emettiSuonoMetallico();
                inviaReportAbuso();
                alert("ATTENZIONE: PIN NON VALIDO. TENTATIVO BLOCCATO.");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
