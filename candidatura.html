<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Candidatura Direzionale // Suprema Future X</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta name="theme-color" content="#D4AF37">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-void: #050608;
      --bg-surface: #090A0D;
      --gold-primary: #D4AF37;
      --gold-bright: #F59E0B;
      --cyan-neon: #00F0FF;
      --silver-bright: #F1F5F9;
      --silver-muted: #94A3B8;
      --alert-green: #00E676;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', system-ui, sans-serif;
      --transition-fast: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-void); color: var(--silver-bright); font-family: var(--font-sans); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }

    /* Top Bar Compatta */
    .sfx-topbar {
      width: 100%; height: 68px; background: rgba(9, 10, 13, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3); display: flex; align-items: center; justify-content: center; position: fixed; top: 0; z-index: 100;
    }
    .sfx-brand-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .sfx-logo-img { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gold-primary); box-shadow: 0 0 10px rgba(212,175,55,0.4); }
    .sfx-brand-title { font-family: var(--font-mono); font-weight: 800; font-size: 1rem; color: #FFF; letter-spacing: 1px; }
    .sfx-brand-title span { color: var(--gold-primary); font-weight: 900; }

    /* Contenitore Form Standalone */
    .sfx-cand-container { margin-top: 110px; width: 100%; max-width: 680px; padding: 0 20px; }
    .sfx-cand-header { text-align: center; margin-bottom: 24px; }
    .sfx-cand-header h1 { font-size: 1.8rem; font-weight: 800; color: #FFF; text-transform: uppercase; margin-bottom: 6px; }
    .sfx-cand-header p { font-size: 0.9rem; color: var(--silver-muted); line-height: 1.6; }

    /* Box Neon */
    .sfx-neon-box { position: relative; background: var(--bg-surface); border-radius: 12px; overflow: hidden; padding: 2px; }
    .sfx-neon-box::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(transparent, var(--cyan-neon), var(--gold-primary), transparent 40%);
      animation: rotate-neon 5s linear infinite; z-index: 0;
    }
    .sfx-neon-inner { position: relative; background: var(--bg-surface); border-radius: 10px; z-index: 1; padding: 32px 24px; }
    @keyframes rotate-neon { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Input & Bottoni */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--gold-primary); font-family: var(--font-mono); margin-bottom: 6px; letter-spacing: 0.5px; }
    .sfx-input {
      width: 100%; padding: 12px 14px; background: rgba(15,23,42,0.85); border: 1px solid rgba(212,175,55,0.3);
      border-radius: 6px; font-family: var(--font-mono); color: #FFF; font-size: 0.9rem; outline: none; transition: var(--transition-fast);
    }
    .sfx-input:focus { border-color: var(--cyan-neon); box-shadow: 0 0 10px rgba(0, 240, 255, 0.25); }

    .btn-submit {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold-primary), #B38F24); color: var(--bg-void);
      border: 1px solid var(--gold-light); border-radius: 6px; font-family: var(--font-sans); font-weight: 800; font-size: 0.95rem;
      text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35); transition: var(--transition-fast); margin-top: 10px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); filter: brightness(1.1); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Footer Certificazione */
    .sfx-footer-badge {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 24px;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--cyan-neon);
    }
    .sfx-shield { width: 12px; height: 12px; border-radius: 2px; background: #00E676; box-shadow: 0 0 8px #00E676; }
  </style>
</head>
<body>

  <!-- Top Bar Minimale -->
  <header class="sfx-topbar">
    <div class="sfx-brand-group" onclick="location.href='index.html'">
      <img src="logo.jpg" alt="Logo Suprema">
      <div class="sfx-brand-title">SUPREMA <span>FUTURE X</span></div>
    </div>
  </header>

  <!-- Modulo Candidatura Standalone -->
  <main class="sfx-cand-container">
    <div class="sfx-cand-header">
      <h1>SCREENING PRESIDENZIALE</h1>
      <p>Prenota il tuo colloquio conoscitivo di 60 minuti condotto interamente dal vivo su Google Meet dal CEO Giuliano Caratelli.</p>
    </div>

    <div class="sfx-neon-box">
      <div class="sfx-neon-inner">
        <form id="form-candidatura" onsubmit="inviaDati(event)">
          
          <div class="form-group">
            <label class="form-label">NOME E COGNOME UFFICIALE *</label>
            <input type="text" id="cand-nome" class="sfx-input" placeholder="Es. Mario Rossi" required>
          </div>

          <div class="form-group">
            <label class="form-label">INDIRIZZO EMAIL *</label>
            <input type="email" id="cand-email" class="sfx-input" placeholder="mario@rossi.it" required>
          </div>

          <div class="form-group">
            <label class="form-label">RECAPITO TELEFONICO / WHATSAPP *</label>
            <input type="tel" id="cand-tel" class="sfx-input" placeholder="+39 347 0000000" required>
          </div>

          <div class="form-group">
            <label class="form-label">USERNAME TELEGRAM (Opzionale)</label>
            <input type="text" id="cand-tg" class="sfx-input" placeholder="@tuousername">
          </div>

          <div class="form-group">
            <label class="form-label">SELEZIONA PERCORSO FORMATIVO</label>
            <select id="cand-percorso" class="sfx-input">
              <option value="Executive Master (299 €)">Executive Master (299 €)</option>
              <option value="Silver Tier (249 €)">Silver Tier (249 €)</option>
              <option value="Premium VIP (349 €)">Premium VIP Mentoring CEO (349 €)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">SLOT ORARIO CONFERENZA CEO</label>
            <select id="cand-slot" class="sfx-input">
              <option value="Lunedì 10:00 - 11:00">Lunedì 10:00 - 11:00</option>
              <option value="Lunedì 15:00 - 16:00">Lunedì 15:00 - 16:00</option>
              <option value="Martedì 21:00 - 22:00">Martedì 21:00 - 22:00</option>
              <option value="Mercoledì 21:00 - 22:00">Mercoledì 21:00 - 22:00</option>
              <option value="Giovedì 18:00 - 19:00">Giovedì 18:00 - 19:00</option>
              <option value="Sabato 11:00 - 12:00">Sabato 11:00 - 12:00</option>
              <option value="Da Concordare">Da Concordare con la Segreteria</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">BREVE DESCRIZIONE OBIETTIVI</label>
            <textarea id="cand-note" rows="3" class="sfx-input" placeholder="Perché vuoi accedere all'Ecosistema Suprema Future X?"></textarea>
          </div>

          <button type="submit" id="btn-submit" class="btn-submit">
            CONFERMA & PRE-CONIA GOLD CARD (+100 PTS)
          </button>

        </form>
      </div>
    </div>

    <div class="sfx-footer-badge">
      <div class="sfx-shield"></div>
      <span>TRASMISSIONE DATI CRITTOGRAFATA EAL6+ SHA-256</span>
    </div>
  </main>

  <!-- Script Integrazione Code.gs & PWA -->
  <script>
    const URL_APPS_SCRIPT = ''; // <--- Inserisci qui il link /exec del tuo Code.gs

    async function inviaDati(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.innerText = "NOTARIZZAZIONE EAL6+ IN CORSO...";
      btn.disabled = true;

      const payload = {
        azione: "REGISTRA_CANDIDATURA",
        nome: document.getElementById('cand-nome').value,
        email: document.getElementById('cand-email').value,
        telefono: document.getElementById('cand-tel').value,
        telegram: document.getElementById('cand-tg').value,
        percorso: document.getElementById('cand-percorso').value,
        slot: document.getElementById('cand-slot').value,
        note: document.getElementById('cand-note').value
      };

      try {
        if (URL_APPS_SCRIPT) {
          await fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        
        document.getElementById('form-candidatura').innerHTML = `
          <div style="text-align:center; padding: 20px 0;">
            <div style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
            <h2 style="color:var(--gold-primary); font-family:var(--font-mono); margin-bottom:12px;">CANDIDATURA ACQUISITA</h2>
            <p style="color:var(--silver-bright); font-size:0.95rem; line-height:1.6; margin-bottom:20px;">
              I tuoi dati sono stati registrati e crittografati nel Vault. 
              <strong>Nicole (AG-02)</strong> ha pre-coniato la tua Suprema Gold Card accreditandoti i <strong>100 Punti Status statutari</strong>.
            </p>
            <p style="color:var(--silver-muted); font-size:0.85rem;">
              La Presidenza verificherà la disponibilità dello slot selezionato e ti contatterà via WhatsApp o Telegram.
            </p>
            <button class="btn-submit" style="max-width:240px; margin-top:24px;" onclick="location.href='index.html'">TORNA ALLA HOME</button>
          </div>
        `;
      } catch (err) {
        alert("Ops, si è verificato un errore di connessione. Riprova.");
        btn.innerText = "CONFERMA & PRE-CONIA GOLD CARD (+100 PTS)";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
