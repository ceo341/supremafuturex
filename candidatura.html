<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Screening Presidenziale // Suprema Future X Enterprise</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Giuliano Caratelli">
  <link rel="icon" type="image/png" href="media/logo.png">
  
  <!-- Font Istituzionali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&family=Syncopate:wght@400;700;800&display=swap" rel="stylesheet">
  
  <!-- Foglio di Stile Globale -->
  <link rel="stylesheet" href="stile-globale.css">
  
  <style>
    /* ========================================================================== */
    /* STILI DEDICATI AL FUNNEL DI SCREENING                                      */
    /* ========================================================================== */
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: var(--font-mont);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08), transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.08), transparent 45%);
    }

    /* Top Bar di Ritorno */
    .top-return-bar {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .btn-return-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      transition: color var(--trans-fast);
      cursor: none;
    }

    .btn-return-home:hover {
      color: var(--cyan-neon);
    }

    .security-badge-top {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    /* Contenitore Form Principale */
    .candidatura-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      border-radius: 28px;
      width: 100%;
      max-width: 900px;
      padding: 3.5rem 3rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      margin-top: 2rem;
    }

    .candidatura-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold-primary), var(--cyan-neon));
    }

    /* Header del Modulo */
    .form-header {
      text-align: center;
      margin-bottom: 2.8rem;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 2rem;
    }

    .form-header-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--cyan-neon);
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--border-cyan);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 1rem;
      letter-spacing: 1.5px;
    }

    .form-header h1 {
      font-family: var(--font-sync);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      color: var(--gold-primary);
      margin-bottom: 0.6rem;
      font-weight: 800;
    }

    .form-header p {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* Griglia Campi */
    .form-grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
    }

    .form-field-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .form-field-group.full-width {
      grid-column: span 2;
    }

    .form-field-label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--gold-light);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .form-field-label span.req {
      color: var(--cyan-neon);
    }

    .form-field-input,
    .form-field-select,
    .form-field-textarea {
      width: 100%;
      background: #020305;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFF;
      padding: 14px 16px;
      border-radius: 10px;
      font-family: var(--font-mont);
      font-size: 0.92rem;
      outline: none;
      transition: border-color var(--trans-fast), box-shadow var(--trans-fast);
      cursor: none;
    }

    .form-field-input:focus,
    .form-field-select:focus,
    .form-field-textarea:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
    }

    .form-field-select option {
      background: #11141C;
      color: #FFF;
      padding: 10px;
    }

    .form-field-textarea {
      resize: vertical;
      min-height: 95px;
      line-height: 1.6;
    }

    /* Informativa Trattamento & Consenso */
    .privacy-consent-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-dark);
      padding: 1.2rem;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-top: 1rem;
    }

    .privacy-consent-box label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: none;
      color: #CCC;
    }

    .privacy-consent-box input[type="checkbox"] {
      margin-top: 3px;
      cursor: none;
      accent-color: var(--gold-primary);
    }

    /* Pulsante Invio */
    .btn-submit-candidatura {
      background: var(--gold-primary);
      color: #000;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-family: var(--font-sync);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: none;
      transition: all var(--trans-fast);
      margin-top: 1.8rem;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.35);
      text-transform: uppercase;
    }

    .btn-submit-candidatura:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.15);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
    }

    /* Box Messaggi di Risposta */
    .form-status-alert {
      margin-top: 1.8rem;
      padding: 1.2rem;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      display: none;
      text-align: center;
    }

    .form-status-alert.success {
      display: block;
      background: rgba(0, 230, 118, 0.1);
      color: var(--status-green);
      border: 1px solid var(--status-green);
    }

    .form-status-alert.error {
      display: block;
      background: rgba(255, 59, 48, 0.1);
      color: var(--status-red);
      border: 1px solid var(--status-red);
    }

    .form-status-alert.warn {
      display: block;
      background: rgba(255, 191, 0, 0.1);
      color: var(--status-amber);
      border: 1px solid var(--status-amber);
    }

    /* Loading Overlay Transizionale */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 10, 14, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 50;
      border-radius: 28px;
    }

    .spinner-vault {
      width: 55px;
      height: 55px;
      border: 4px solid rgba(0, 240, 255, 0.15);
      border-top-color: var(--cyan-neon);
      border-bottom-color: var(--gold-primary);
      border-radius: 50%;
      animation: spinVault 1s linear infinite;
      margin-bottom: 1.5rem;
    }

    @keyframes spinVault {
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .candidatura-card {
        padding: 2.5rem 1.8rem;
        margin-top: 3.5rem;
      }
      .form-grid-layout {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
      .form-field-group.full-width {
        grid-column: span 1;
      }
      .top-return-bar {
        position: relative;
        top: 0;
        left: 0;
        right: 0;
        margin-bottom: 1.5rem;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Cursore Magnetico -->
  <div class="sfx-cursor" id="magnetic-cursor"></div>

  <!-- Sfondo Ambientale -->
  <div class="ambient-bg"></div>

  <!-- Barra Superiore di Navigazione -->
  <div class="top-return-bar">
    <a href="index.html" class="btn-return-home magnetic-target">◄ TORNA ALLA LANDING PAGE</a>
    <div class="security-badge-top">EAL6+ ENCRYPTED INGESTION // AG-10 BRIDGE</div>
  </div>

  <!-- Modulo di Candidatura Centrale -->
  <main class="candidatura-card">
    
    <!-- Schermo di Crittografia e Invio -->
    <div id="loading-overlay">
      <div class="spinner-vault"></div>
      <div style="font-family:var(--font-sync); color:var(--gold-primary); font-size:1rem; margin-bottom:0.5rem; letter-spacing:1px;">AUTENTICAZIONE IN CORSO</div>
      <div style="font-family:var(--font-mono); color:var(--cyan-neon); font-size:0.8rem;">INOLTRO PAYLOAD AL REGISTRO PRESIDENZIALE...</div>
    </div>

    <!-- Header del Funnel -->
    <header class="form-header">
      <div class="form-header-badge">ACCESSO SELETTIVO A NUMERO CHIUSO</div>
      <h1>SCREENING PRESIDENZIALE</h1>
      <p>COLLOQUIO CONOSCITIVO 60 MINUTI // GOOGLE MEET RISERVATO CON IL CEO</p>
    </header>

    <!-- Form Funnel -->
    <form id="form-screening" autocomplete="off">
      <div class="form-grid-layout">
        
        <!-- Nome -->
        <div class="form-field-group">
          <label class="form-field-label" for="inp-nome">
            <span>NOME</span>
            <span class="req">*</span>
          </label>
          <input type="text" id="inp-nome" class="form-field-input magnetic-target" required placeholder="Es. Mario">
        </div>

        <!-- Cognome -->
        <div class="form-field-group">
          <label class="form-field-label" for="inp-cognome">
            <span>COGNOME</span>
            <span class="req">*</span>
          </label>
          <input type="text" id="inp-cognome" class="form-field-input magnetic-target" required placeholder="Es. Rossi">
        </div>

        <!-- Email -->
        <div class="form-field-group">
          <label class="form-field-label" for="inp-email">
            <span>INDIRIZZO EMAIL</span>
            <span class="req">*</span>
          </label>
          <input type="email" id="inp-email" class="form-field-input magnetic-target" required placeholder="nome@dominio.it">
        </div>

        <!-- Telefono / WhatsApp -->
        <div class="form-field-group">
          <label class="form-field-label" for="inp-whatsapp">
            <span>RECAPITO WHATSAPP</span>
            <span class="req">*</span>
          </label>
          <input type="tel" id="inp-whatsapp" class="form-field-input magnetic-target" required placeholder="+39 347 ...">
        </div>

        <!-- Percorso di Interesse (Preselezionato da URL) -->
        <div class="form-field-group full-width">
          <label class="form-field-label" for="inp-tier">
            <span>PROGRAMMA DIDATTICO O CONCESSIONE RICHIESTA</span>
            <span class="req">*</span>
          </label>
          <select id="inp-tier" class="form-field-select magnetic-target" required>
            <option value="">Seleziona il programma per lo screening...</option>
            <option value="silver">Silver Tier (60 Giorni) — Didattica Live & Riorientamento [€ 249,00 // +300 PTS]</option>
            <option value="master">Executive Master (90 Giorni) — Automazione d'Impresa & AI [€ 299,00 // +350 PTS]</option>
            <option value="vip">Premium VIP (120 Giorni) — One-to-One con il CEO Giuliano Caratelli [€ 349,00 // +500 PTS]</option>
            <option value="negozio">Concessione Negozio Digitale — Modello Autonomo a Zero Magazzino [+800 PTS]</option>
            <option value="orientamento">Richiesta di Orientamento Globale / Valutazione Curricolare</option>
          </select>
        </div>

        <!-- Slot Orario Calendario Presidenziale 60 Minuti -->
        <div class="form-field-group full-width">
          <label class="form-field-label" for="inp-slot">
            <span>DISPONIBILITÀ SLOT ORARIO (CALENDARIO LUNEDÌ - SABATO)</span>
            <span class="req">*</span>
          </label>
          <select id="inp-slot" class="form-field-select magnetic-target" required>
            <option value="">Seleziona la fascia oraria preferenziale per la videochiamata...</option>
            <option value="LUN_10_12">Lunedì — Fascia Mattutina (10:00 - 12:00)</option>
            <option value="LUN_15_18">Lunedì — Fascia Pomeridiana (15:00 - 18:00)</option>
            <option value="MAR_15_18">Martedì — Fascia Pomeridiana (15:00 - 18:00)</option>
            <option value="MAR_21_23">Martedì — Fascia Serale Riservata (21:00 - 23:00)</option>
            <option value="MER_21_23">Mercoledì — Fascia Serale Riservata (21:00 - 23:00)</option>
            <option value="VEN_21_23">Venerdì — Fascia Serale Riservata (21:00 - 23:00)</option>
            <option value="SAB_FAST_TRACK">Sabato — Fast-Track Flessibile (Concordato su WhatsApp)</option>
          </select>
        </div>

        <!-- Descrizione Obiettivi / Background -->
        <div class="form-field-group full-width">
          <label class="form-field-label" for="inp-note">
            <span>PRESENTAZIONE SINTETICA DEGLI OBIETTIVI</span>
            <span style="color:var(--text-muted); font-size:0.7rem;">FACOLTATIVO</span>
          </label>
          <textarea id="inp-note" class="form-field-textarea magnetic-target" placeholder="Indica brevemente la tua occupazione attuale, le ragioni della candidatura o gli obiettivi che intendi raggiungere..."></textarea>
        </div>

      </div>

      <!-- Consenso Statutario & Privacy -->
      <div class="privacy-consent-box">
        <label>
          <input type="checkbox" id="chk-statuto" required>
          <span>Dichiaro di aver preso visione dello <a href="statuto.html" style="color:var(--gold-primary); text-decoration:underline;" target="_blank">Statuto Ufficiale e del Codice Etico</a>, di essere a conoscenza della garanzia della didattica 100% dal vivo e confermo che i dati forniti sono veritieri per l'istruttoria conoscitiva.</span>
        </label>
      </div>

      <!-- Pulsante di Invio -->
      <button type="submit" class="btn-submit-candidatura magnetic-target">
        TRASMETTI CANDIDATURA ALLA PRESIDENZA ➔
      </button>

      <!-- Feedback Telemetrico di Risposta -->
      <div id="form-feedback" class="form-status-alert"></div>
    </form>

  </main>

  <!-- Script Funnel EAL6+ -->
  <script src="js/code.js"></script>
  <script>
    // 1. Gestione Cursore Magnetico
    const cursor = document.getElementById('magnetic-cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    function initMagneticElements() {
      document.querySelectorAll('.magnetic-target').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
      });
    }
    initMagneticElements();

    // 2. Preselezione Automatica del Tier dai Parametri URL (?tier=silver)
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tierParam = urlParams.get('tier');
      if (tierParam) {
        const selectTier = document.getElementById('inp-tier');
        const match = Array.from(selectTier.options).find(opt => opt.value === tierParam.toLowerCase());
        if (match) {
          match.selected = true;
          selectTier.style.borderColor = 'var(--gold-primary)';
        }
      }
    });

    // 3. Elaborazione Invio Form con Ingestion Bridge (AG-10)
    document.getElementById('form-screening').addEventListener('submit', async function (e) {
      e.preventDefault();

      const feedback = document.getElementById('form-feedback');
      const loader = document.getElementById('loading-overlay');
      feedback.className = 'form-status-alert';
      feedback.innerText = '';

      const payload = {
        action: "submit_candidatura",
        nome: document.getElementById('inp-nome').value.trim(),
        cognome: document.getElementById('inp-cognome').value.trim(),
        email: document.getElementById('inp-email').value.trim(),
        whatsapp: document.getElementById('inp-whatsapp').value.trim(),
        tier: document.getElementById('inp-tier').value,
        slot: document.getElementById('inp-slot').value,
        note: document.getElementById('inp-note').value.trim(),
        timestamp: new Date().toISOString()
      };

      // Controllo di validazione integrato tramite code.js
      if (window.SFX && typeof window.SFX.validateCandidaturaPayload === 'function') {
        const validation = window.SFX.validateCandidaturaPayload(payload);
        if (!validation.isValid) {
          feedback.classList.add('error');
          feedback.innerHTML = validation.errors.join('<br>');
          return;
        }
      }

      // Attiva overlay di crittografia e invio
      loader.style.display = 'flex';

      try {
        const endpoint = (window.SFX && window.SFX.CONFIG) 
          ? window.SFX.CONFIG.BACKEND_URL 
          : "https://script.google.com/macros/s/AKfycbzs3OJONGpbMB0ja6cCHLlVLYEnUMWn797t_h9YfCFauxiyLAG-FzXLI05cbTD5tEXm5Q/exec";

        let result;
        // Metodo asincrono con gestione ritentativi offline
        if (window.SFX && typeof window.SFX.robustPostPayload === 'function') {
          result = await window.SFX.robustPostPayload(endpoint, payload);
        } else {
          // Fallback nativo
          await fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          result = { success: true };
        }

        // Simulazione latenza di convalida forense EAL6+
        setTimeout(() => {
          loader.style.display = 'none';

          if (result && result.success) {
            feedback.classList.add('success');
            feedback.innerHTML = `
              <strong>CANDIDATURA TRASMESSA CON SUCCESSO.</strong><br>
              Il tuo dossier è stato inoltrato alla Presidenza. Riceverai il link riservato di Google Meet direttamente sul tuo recapito WhatsApp entro 24 ore.
            `;
            document.getElementById('form-screening').reset();

            // Chime acustico di conferma
            if (window.SFX && typeof window.SFX.playAudioChime === 'function') {
              window.SFX.playAudioChime("AUTH_SUCCESS");
            }
          } else if (result && result.queued) {
            feedback.classList.add('warn');
            feedback.innerHTML = `
              <strong>CONNESSIONE ASSENTE // DOSSIER SALVATO IN CODA LOCALE.</strong><br>
              I dati sono crittografati in memoria e verranno trasmessi automaticamente al server non appena il dispositivo tornerà online.
            `;
          } else {
            throw new Error((result && result.error) || "Impossibile completare la trasmissione telemetrica.");
          }
        }, 1200);

      } catch (err) {
        loader.style.display = 'none';
        feedback.classList.add('error');
        feedback.innerText = "ERRORE EAL6+ NEL PROCESSO DI TRASMISSIONE: " + err.message;
      }
    });
  </script>
</body>
</html>
