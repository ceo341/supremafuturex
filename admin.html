<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suprema Future X - X-Box Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Space Grotesk"', 'sans-serif'] },
          colors: { brand: { gold: '#d4af37', cyan: '#00f0ff', bgDark: '#0e141b' } }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0e141b; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; }
    .glass-panel { background: rgba(17, 23, 34, 0.78); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.07); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-xs md:text-sm">

  <header class="w-full border-b border-brand-border/40 bg-black/60 px-4 py-2 text-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <span class="text-brand-gold font-semibold"><i class="fa-solid fa-crown"></i> X-BOX CONTROL ROOM - ROOT</span>
      <a href="index.html" class="text-brand-cyan border border-brand-cyan/30 px-3 py-1 rounded-full"><i class="fa-solid fa-arrow-left"></i> Landing Page</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 flex flex-col gap-6">
    <div class="glass-panel rounded-2xl p-5 flex items-center justify-between border-l-4 border-l-brand-gold">
      <div>
        <h1 class="text-xl font-bold text-white">BANCA DATI LEAD & REGISTRO IN TEMPO REALE</h1>
        <p class="text-xs text-gray-400">Sincronizzazione diretta dal foglio CRM Google Sheets.</p>
      </div>
      <button onclick="syncXBoxData()" class="px-4 py-2 rounded-xl bg-brand-gold text-black font-bold flex items-center gap-2">
        <i class="fa-solid fa-arrows-rotate"></i> SYNC TOTALE X-BOX
      </button>
    </div>

    <!-- TABELLA DATI LIVE -->
    <section class="glass-panel rounded-2xl p-5">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="border-b border-white/10 text-gray-400 font-mono text-[11px] uppercase">
            <tr>
              <th class="py-2.5 px-3">Nome / Città</th>
              <th class="py-2.5 px-3">Recapito</th>
              <th class="py-2.5 px-3">Slot / Codice</th>
              <th class="py-2.5 px-3">Stato Pipeline</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody" class="divide-y divide-white/5 text-gray-300">
            <tr><td colspan="4" class="py-4 text-center text-gray-500">Clicca su "SYNC TOTALE X-BOX" per caricare i lead dal CRM.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbfoE7huMaPtw_ecruZTTbB2IEV3mnnGfqudtkLEh8UreKw2nZHitnBml8M6TbKYrI/exec";

    async function syncXBoxData() {
      try {
        const res = await fetch(SCRIPT_URL);
        const leads = await res.json();
        
        if (Array.isArray(leads) && leads.length > 0) {
          const tbody = document.getElementById('leadsTableBody');
          tbody.innerHTML = '';
          
          leads.forEach(lead => {
            var dateStr = lead.timestamp ? new Date(lead.timestamp).toLocaleDateString("it-IT") : "Recente";
            tbody.innerHTML += `
              <tr class="hover:bg-white/[0.02]">
                <td class="py-3 px-3 font-semibold text-white">${lead.name || 'N/A'}<br><span class="text-[10px] text-gray-400">${lead.city || 'N/A'}</span></td>
                <td class="py-3 px-3 font-mono text-[11px]">${lead.email || 'N/A'}<br><span class="text-gray-500">${lead.phone || 'N/A'}</span></td>
                <td class="py-3 px-3 text-[11px]">${lead.date || dateStr} - ${lead.slot || 'N/A'}<br><span class="text-brand-gold font-mono text-[10px]">${lead.nexusCode || 'NEXUS'}</span></td>
                <td class="py-3 px-3"><span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-mono">${lead.status || 'QUALIFICATO VIP'}</span></td>
              </tr>
            `;
          });
          alert('Sincronizzazione completata: ' + leads.length + ' lead caricati dal CRM!');
        } else {
          alert('Nessun lead presente nel foglio.');
        }
      } catch(e) {
        alert('Errore durante la sincronizzazione.');
      }
    }
  </script>
</body>
</html>
