<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suprema Future X - Governance & Presidenza</title>
    <style>
        /* ==========================================================================
           1. IMPOSTAZIONI GLOBALI E SFONDO IBRIDO
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* L'IMMAGINE DEL RENDER 3D VA INSERITA QUI SOTTO COME SFONDO */
            background-image: url('sfondo-render.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Effetto Glassmorphism (Vetro Satinato) per l'interfaccia appoggiata sopra */
        .glass-panel {
            background: rgba(246, 242, 235, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* ==========================================================================
           2. TOP BAR E ALISON BADGE
           ========================================================================== */
        .top-bar {
            width: 95%;
            height: 50px;
            margin-top: 2vh;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 20;
        }

        .status-node {
            display: flex; align-items: center; gap: 12px;
            font-size: 0.85rem; font-weight: 800; color: #0B192C; letter-spacing: 0.5px;
        }

        .led {
            width: 12px; height: 12px; border-radius: 50%;
            background: #00E676;
            box-shadow: 0 0 12px #00E676, 0 0 20px #00E676;
            animation: pulse 1.5s infinite alternate;
        }

        .clock { font-size: 0.95rem; font-weight: 800; color: #0B192C; }

        .alison-badge {
            position: absolute; top: 9vh; right: 2.5%;
            border-radius: 25px; padding: 10px 20px;
            display: flex; align-items: center; gap: 12px;
            font-weight: 900; color: #0B192C; font-size: 0.85rem;
            animation: floating 4s infinite alternate ease-in-out;
            z-index: 20; cursor: pointer;
        }

        .alison-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: #FFF;
            border: 2px solid #D4AF37; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        /* ==========================================================================
           3. TESTATA ANIMATA (PING-PONG) E FULCRO CENTRALE
           ========================================================================== */
        .hero { text-align: center; margin-top: 2vh; z-index: 10; width: 100%; }

        .title {
            font-size: 5vw; font-weight: 900; letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(90deg, #E2C275, #00F0FF, #E2C275);
            background-size: 200% 100%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0, 240, 255, 0.4));
            animation: pingPong 4s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
            margin-bottom: -5px;
        }

        .subtitle { font-size: 1.2vw; font-weight: 800; color: #0B192C; letter-spacing: 3px; text-transform: uppercase; }

        /* Contenitore invisibile per allineare il carosello sopra il logo del render */
        .central-stage {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            width: 100%; z-index: 5;
        }

        .carousel-container {
            position: relative;
            width: 45vw; max-width: 600px; 
            aspect-ratio: 16 / 9; /* Proporzione ovale/rettangolare */
            border-radius: 50%; /* Adatta al render */
            display: flex; justify-content: center; align-items: center;
            animation: floating 3.5s infinite alternate ease-in-out;
        }

        .sfx-monogram {
            font-size: 8vw; font-weight: 900; font-style: italic; color: #E5C158;
            text-shadow: 0 0 40px #00F0FF; z-index: 5;
            transition: opacity 0.8s ease, transform 0.8s ease; letter-spacing: -5px;
        }

        .carousel-image {
            position: absolute; width: 100%; height: 100%; object-fit: contain;
            border-radius: 50%; z-index: 4; opacity: 0; transition: opacity 0.8s ease-in-out;
        }

        /* ==========================================================================
           4. BARRA INFERIORE E MENU HAMBURGER (10 SECONDI)
           ========================================================================== */
        .bottom-nav { width: 95%; position: relative; margin-bottom: 3vh; z-index: 20; }

        .capsule-bar {
            width: 100%; height: 75px; border-radius: 40px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
        }

        .capsule-btn {
            flex: 1; margin: 0 6px; height: 50px; border-radius: 25px;
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,242,235,0.9));
            border: 1.5px solid #D4AF37;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            font-weight: 800; font-size: 0.9vw; color: #0B192C; white-space: nowrap;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .capsule-btn:hover { transform: translateY(-4px); border-color: #00F0FF; box-shadow: 0 8px 20px rgba(0, 240, 255, 0.4); }

        .hamburger-dropdown {
            position: absolute; bottom: calc(100% + 15px); left: 15px; width: 340px;
            border-radius: 20px; padding: 18px;
            display: flex; flex-direction: column; gap: 12px;
            opacity: 0; pointer-events: none; transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95); z-index: 100;
        }

        .hamburger-dropdown.active { opacity: 1; pointer-events: all; transform: translateY(0); }

        .menu-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; font-weight: 800; color: #0B192C;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4); padding-bottom: 8px;
        }
        
        .countdown-text { color: #E65100; font-weight: 900; }

        .menu-item {
            padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,0.8);
            border: 1px solid rgba(212, 175, 55, 0.5); font-weight: 800; color: #0B192C;
            display: flex; justify-content: space-between; cursor: pointer; transition: 0.2s;
        }
        .menu-item:hover { background: #E0F7FA; border-color: #00F0FF; transform: translateX(5px); }

        /* Animazioni base */
        @keyframes pingPong { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        @keyframes floating { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar glass-panel">
        <div class="status-node"><div class="led"></div> NODO DI TRASMISSIONE: ROMA CENTRO // PROTOCOLLO EAL6+ CERTIFICATO</div>
        <div class="clock" id="live-clock">--:--:-- CET</div>
    </header>

    <!-- Alison Badge -->
    <aside class="alison-badge glass-panel">
        <div class="alison-avatar">👩‍🚀</div>
        <div style="line-height: 1.1;">Alison<br>AG-01</div>
    </aside>

    <!-- Titoli Animati -->
    <section class="hero">
        <h1 class="title">SUPREMA FUTURE X</h1>
        <h2 class="subtitle">INSIEME GUIDIAMO IL TUO DOMANI</h2>
    </section>

    <!-- Contenitore Trasparente Carosello (Allineato sul render) -->
    <main class="central-stage">
        <div class="carousel-container">
            <div class="sfx-monogram" id="sfx-logo">SFX</div>
            <!-- Pesca le foto dalla cartella media di GitHub -->
            <img src="" class="carousel-image" id="carousel-img" alt="Governance Image">
        </div>
    </main>

    <!-- Bottom Bar e Menu 10s -->
    <nav class="bottom-nav">
        <!-- Dropdown -->
        <div class="hamburger-dropdown glass-panel" id="dropdown-menu">
            <div class="menu-header">
                <span>NAVIGAZIONE PORTALE</span>
                <span class="countdown-text" id="timer-label">CHIUSURA: 10s</span>
            </div>
            <div class="menu-item" onclick="routeTo('#governance')">🏛️ Presidenza & Governance <span>→</span></div>
            <div class="menu-item" onclick="routeTo('#struttura')">📊 Struttura Aziendale <span>→</span></div>
            <div class="menu-item" onclick="routeTo('#protocolli')">🔐 Protocolli Sicurezza <span>→</span></div>
        </div>

        <div class="capsule-bar glass-panel">
            <button class="capsule-btn" id="btn-menu" style="font-size: 1.1vw;">☰ SUPREMA MENU</button>
            <button class="capsule-btn" onclick="routeTo('#chatbot')">💬 ALISON CHATBOT</button>
            <button class="capsule-btn" onclick="routeTo('#traduttore')">🌍 SUPREMA TRADUTTORE</button>
            <button class="capsule-btn" onclick="routeTo('#storie')">📖 CHI SIAMO (3 STORIE)</button>
            <button class="capsule-btn" onclick="routeTo('#radio')">📻 SUPREMA RADIO</button>
            <button class="capsule-btn" onclick="routeTo('#telemetria')">⚙️ TELEMETRIA LIVE</button>
        </div>
    </nav>

    <script>
        // 1. Orologio
        setInterval(() => { document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('it-IT') + ' CET'; }, 1000);

        // 2. Logica Carosello GitHub (SFX -> 10 Foto)
        const sfxLogo = document.getElementById('sfx-logo');
        const carouselImg = document.getElementById('carousel-img');
        let currentPhotoIndex = 1;

        // Visualizza SFX per 3 secondi esatti
        setTimeout(() => {
            sfxLogo.style.opacity = '0';
            sfxLogo.style.transform = 'scale(0.8)';
            setTimeout(() => {
                sfxLogo.style.display = 'none';
                carouselImg.style.display = 'block';
                runImageCarousel();
                setInterval(runImageCarousel, 3200); // Cambio ogni 3.2s
            }, 800);
        }, 3000);

        function runImageCarousel() {
            // Percorso esatto GitHub: media/logo-01.jpg
            const numStr = currentPhotoIndex.toString().padStart(2, '0');
            carouselImg.src = `media/logo-${numStr}.jpg`;
            
            carouselImg.style.opacity = '0';
            setTimeout(() => { carouselImg.style.opacity = '1'; }, 50);

            currentPhotoIndex = (currentPhotoIndex >= 10) ? 1 : currentPhotoIndex + 1;
        }

        // 3. Logica Menu Hamburger a 10s
        const btnMenu = document.getElementById('btn-menu');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const timerLabel = document.getElementById('timer-label');
        let menuTimerId;
        let secondsRemaining = 10;

        function chiudiMenu() {
            dropdownMenu.classList.remove('active');
            clearInterval(menuTimerId);
        }

        function apriMenu() {
            dropdownMenu.classList.add('active');
            secondsRemaining = 10;
            timerLabel.textContent = `CHIUSURA: ${secondsRemaining}s`;

            clearInterval(menuTimerId);
            menuTimerId = setInterval(() => {
                secondsRemaining--;
                timerLabel.textContent = `CHIUSURA: ${secondsRemaining}s`;
                if (secondsRemaining <= 0) chiudiMenu();
            }, 1000);
        }

        btnMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.contains('active') ? chiudiMenu() : apriMenu();
        });

        document.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target) && e.target !== btnMenu) chiudiMenu();
        });

        function routeTo(hashPath) {
            chiudiMenu();
            window.location.hash = hashPath;
        }
    </script>
</body>
</html>
