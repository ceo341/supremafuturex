<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbfoE7huMaPtw_ecruZTTbB2IEV3mnnGfqudtkLEh8UreKw2nZHitnBml8M6TbKYrI/exec";

  async function handleBooking(e) {
    e.preventDefault();
    
    const modal = document.getElementById('nexusModal');
    const modalLoading = document.getElementById('modalLoading');
    const modalSuccess = document.getElementById('modalSuccess');
    const codeDisplay = document.getElementById('nexusCodeDisplay');

    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    if (modalLoading) modalLoading.classList.remove('hidden');
    if (modalSuccess) modalSuccess.classList.add('hidden');

    const randomNum = String(Math.floor(Math.random() * 9999) + 1).padStart(5, '0');
    const generatedCode = 'NEXUS ' + randomNum;

    // Lettura completa di TUTTI i campi del form Stitch
    const payload = {
      nexus_code: generatedCode,
      name: (document.getElementById('leadNome') || document.getElementById('nexus-name') || {}).value || "N/A",
      city: (document.getElementById('leadCitta') || document.getElementById('nexus-city') || {}).value || "N/A",
      email: (document.getElementById('leadEmail') || document.getElementById('nexus-email') || {}).value || "N/A",
      phone: (document.getElementById('leadTel') || document.getElementById('nexus-phone') || {}).value || "N/A",
      date: (document.getElementById('leadData') || {}).value || "Da Concordare",
      slot: (document.getElementById('leadOrario') || {}).value || "Da Concordare"
    };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      console.log("Invio inviato al server.");
    }

    if (codeDisplay) codeDisplay.innerText = generatedCode;

    setTimeout(() => {
      if (modalLoading) modalLoading.classList.add('hidden');
      if (modalSuccess) modalSuccess.classList.remove('hidden');
    }, 1000);
  }

  function closeModal() {
    const modal = document.getElementById('nexusModal');
    const form = document.getElementById('bookingForm') || document.getElementById('nexus-form');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
    if (form) form.reset();
  }

  function handleAlisonSend() {
    const input = document.getElementById('aiInput');
    if (!input || !input.value.trim()) return;
    alert('Alison AI ha ricevuto la richiesta: "' + input.value + '". Risposta in elaborazione sul canale Zurigo 42ms...');
    input.value = '';
  }
</script>
