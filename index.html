<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suprema Future X - Light Luxury UI</title>
    <style>
        /* 1. REGISTRO CROMATICO E VARIABILI */
        :root {
            --perla-satinato: #F6F2EB;
            --ciano-neon: #00F0FF;
            --verde-smeraldo: #00E676;
            --oro-solare: #FFD700;
            --oro-spazzolato: #D4AF37;
            --blu-notte: #0B192C;
            --vetro-satinato: rgba(255, 255, 255, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--perla-satinato);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 2. FASCI SPETTRALI E PORTALI A MEZZALUNA */
        .portal {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 150px;
            height: 60vh;
            border-radius: 50%;
            border: 5px solid var(--oro-spazzolato);
            box-shadow: inset 0 0 30px var(--ciano-neon), 0 0 30px var(--ciano-neon);
            z-index: 1;
        }
        .portal.left { left: -100px; border-left: none; }
        .portal.right { right: -100px; border-right: none; }

        .laser-beam {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 200px;
            background: linear-gradient(90deg, 
                rgba(0,240,255,0.4) 0%, 
                rgba(0,230,118,0.1) 50%, 
                rgba(0,240,255,0.4) 100%);
            z-index: 0;
            animation: spectral-sweep 4s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 3. TESTATA E TITOLI (Onda Cromatica a Pendolo) */
        .header {
            position: absolute;
            top: 10%;
            text-align: center;
            z-index: 10;
        }
        
        .title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #E2C275, #38C8D8, #E2C275);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            color: transparent;
            animation: ping-pong-gradient 3s infinite alternate ease-in-out;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--blu-notte);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* 4. SCOCCA OVALE CENTRALE (Levitazione Idrodinamica) */
        .oval-bezel {
            position: relative;
            width: 450px;
            height: 250px;
            border-radius: 50%; /* Geometria ovale perfetta */
            border: 6px solid var(--oro-spazzolato);
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(226,247,246,0.6) 100%);
            box-shadow: 
                0 0 40px rgba(0, 240, 255, 0.4), 
                inset 0 0 30px rgba(0, 230, 118, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            animation: floating-idle 3.5s infinite alternate ease-in-out;
            overflow: hidden;
        }

        /* Testo iniziale e Immagini loop */
        .sfx-text {
            font-size: 5rem;
            font-weight: 900;
            color: var(--oro-spazzolato);
            text-shadow: 0 0 20px var(--ciano-neon);
            transition: opacity 0.8s ease;
        }

        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            opacity: 0;
            transition: opacity 0.8s ease;
            display: none;
        }

        /* 5. BARRA DI STATO INFERIORE (Glassmorphism) */
        .status-bar {
            position: absolute;
            bottom: 8%;
            width: 80%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--vetro-satinato);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 15px 30px;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .capsule {
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--oro-spazzolato);
            background: rgba(255,255,255,0.6);
            color: var(--blu-notte);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .capsule:hover {
            box-shadow: 0 0 15px var(--ciano-neon);
            transform: scale(1.05);
        }

        /* Badge Alison Fluttuante */
        .alison-badge {
            position: absolute;
            right: 5%;
            top: 20%;
            background: var(--vetro-satinato);
            backdrop-filter: blur(10px);
            border: 2px solid var(--oro-spazzolato);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: var(--blu-notte);
            animation: floating-idle 4s infinite alternate ease-in-out;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* Hamburger Menu Dropdown */
        .dropdown {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            background: var(--vetro-satinato);
            backdrop-filter: blur(16px);
            border: 1px solid var(--oro-spazzolato);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .dropdown.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .dropdown-item {
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255,255,255,0.5);
            font-weight: bold;
            color: var(--blu-notte);
            cursor: pointer;
        }
        .dropdown-item:hover { background: rgba(0, 240, 255, 0.2); }

        /* ANIMAZIONI CHIAVE (Ping-Pong e Oscillazioni) */
        @keyframes ping-pong-gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes floating-idle {
            0% { transform: translateY(-4px); }
            100% { transform: translateY(4px); }
        }

        @keyframes spectral-sweep {
            0% { background-position: -200% 0; opacity: 0.5; filter: hue-rotate(0deg); }
            100% { background-position: 200% 0; opacity: 1; filter: hue-rotate(45deg); }
        }
    </style>
</head>
<body>

    <!-- Fasci di luce passanti e portali -->
    <div class="laser-beam"></div>
    <div class="portal left"></div>
    <div class="portal right"></div>

    <!-- Modulo Alison -->
    <div class="alison-badge">
        <span style="font-size: 1.5rem;">👩‍🚀</span>
        Alison<br>AG-01
    </div>

    <!-- Testata -->
    <div class="header">
        <h1 class="title">Suprema Future X</h1>
        <div class="subtitle">INSIEME GUIDIAMO IL TUO DOMANI</div>
    </div>

    <!-- Ovale Centrale -->
    <div class="oval-bezel" id="central-logo">
        <div class="sfx-text" id="sfx-text">SFX</div>
        <img src="" alt="Loop Foto" class="carousel-img" id="carousel-img">
    </div>

    <!-- Barra di Stato -->
    <div class="status-bar">
        <div style="position: relative;">
            <div class="capsule" id="btn-menu">≡ SUPREMA MENU</div>
            <!-- Menu a tendina 10 secondi -->
            <div class="dropdown" id="dropdown-menu">
                <div class="dropdown-item">Governance</div>
                <div class="dropdown-item">Presidenza</div>
                <div class="dropdown-item">Opzioni Sistema</div>
            </div>
        </div>
        <div class="capsule">💬 ALISON CHATBOT</div>
        <div class="capsule">🌍 SUPREMA TRADUTTORE</div>
        <div class="capsule">📖 CHI SIAMO</div>
        <div class="capsule">📻 SUPREMA RADIO</div>
        <div class="capsule">⚙️ TELEMETRIA LIVE</div>
    </div>

    <script>
        /* LOGICA 1: LOOP FOTOGRAFICO CENTRALE (Dopo 3 secondi inizia il carosello) */
        const sfxText = document.getElementById('sfx-text');
        const carouselImg = document.getElementById('carousel-img');
        let currentImageIndex = 1;
        let isCarouselRunning = false;

        // Inizializza il timer di 3 secondi per la scritta fissa
        setTimeout(() => {
            // Dissolvenza in uscita della scritta SFX
            sfxText.style.opacity = '0';
            
            setTimeout(() => {
                sfxText.style.display = 'none';
                carouselImg.style.display = 'block';
                // Mostra la prima immagine
                updateCarouselImage();
                // Avvia il loop infinito (cambio ogni 3 secondi)
                setInterval(updateCarouselImage, 3000);
            }, 800); // attende la fine dell'opacità CSS
        }, 3000);

        function updateCarouselImage() {
            // Genera stringa formattata (01, 02... 10)
            let numString = currentImageIndex.toString().padStart(2, '0');
            // Associa il percorso esatto richiesto
            carouselImg.src = `media/logo-${numString}.jpg`;
            
            // Effetto dissolvenza in ingresso incrociato
            carouselImg.style.opacity = '0';
            setTimeout(() => { carouselImg.style.opacity = '1'; }, 50);

            // Incrementa per il prossimo giro
            currentImageIndex++;
            if(currentImageIndex > 10) currentImageIndex = 1;
        }

        /* LOGICA 2: MENU HAMBURGER CON TIMER 10 SECONDI E PING-PONG */
        const btnMenu = document.getElementById('btn-menu');
        const dropdown = document.getElementById('dropdown-menu');
        let menuTimeoutId;

        function openMenu() {
            dropdown.classList.add('active');
            resetMenuTimer();
        }

        function closeMenu() {
            dropdown.classList.remove('active');
            clearTimeout(menuTimeoutId);
        }

        function resetMenuTimer() {
            clearTimeout(menuTimeoutId);
            // Autochiusura esatta a 10 secondi
            menuTimeoutId = setTimeout(() => {
                closeMenu();
            }, 10000);
        }

        btnMenu.addEventListener('click', () => {
            if (dropdown.classList.contains('active')) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        // Se l'utente clicca una voce del sottomenu, chiude subito e cancella il timer
        const menuItems = document.querySelectorAll('.dropdown-item');
        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                closeMenu();
                // Qui andrebbe inserito il link effettivo, es: window.location.href = '...';
            });
        });
    </script>
</body>
</html>
