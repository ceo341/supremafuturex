<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suprema Future X - Riserva Conferenza VIP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background-color: #05070a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .nexus-card {
      background: #0d1117;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 30px 25px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .nexus-title {
      color: #ffffff;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .nexus-subtitle {
      color: #8b949e;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      color: #8b949e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: #e5c158;
    }

    .nexus-btn {
      width: 100%;
      padding: 15px;
      background: #e5c158;
      border: none;
      border-radius: 6px;
      color: #000000;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease;
    }

    .nexus-btn:hover {
      opacity: 0.9;
    }

    .nexus-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Box Certificato: inizialmente NASCOSTO */
    #nexus-result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #e5c158;
      border-radius: 8px;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-title {
      color: #e5c158;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .result-code {
      color: #ffffff;
      font-size: 14px;
      margin: 4px 0;
    }

    .result-code span {
      color: #00f2fe;
      font-weight: 700;
    }

    .result-note {
      color: #8b949e;
      font-size: 11px;
      margin-top: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="nexus-card">
    <h3 class="nexus-title">RISERVA CONFERENZA VIP DIRETTA (NEXUS)</h3>
    <p class="nexus-subtitle">Compila i campi sottostanti per generare il tuo pass di priorità ed essere ricontattato.</p>
    
    <form id="nexus-form">
      <div class="form-group">
        <label class="form-label" for="nexus-name">NOME COMPLETO / AZIENDA</label>
        <input type="text" id="nexus-name" class="form-input" required placeholder="Inserisci il tuo nome">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="nexus-phone">RECAPITO TELEFONICO / WHATSAPP</label>
        <input type="tel" id="nexus-phone" class="form-input" required placeholder="Es. 3474429091">
      </div>
      
      <button type="submit" id="nexus-btn" class="nexus-btn">CONFERMA & GENERA CERTIFICATO NEXUS</button>
    </form>

    <!-- Box di esito: compare SOLO a invio effettuato -->
    <div id="nexus-result">
      <div class="result-title">CERTIFICATO NEXUS GENERATO CON SUCCESSO</div>
      <div class="result-code">Codice Tracciamento: <span id="nexus-code-display"></span></div>
      <div class="result-note">Il nostro agente Alison AI ha preso in carico la richiesta.</div>
    </div>
  </div>

  <script>
    document.getElementById("nexus-form").addEventListener("submit", function(e) {
      e.preventDefault();
      
      var btn = document.getElementById("nexus-btn");
      btn.innerText = "GENERAZIONE CERTIFICATO IN CORSO...";
      btn.disabled = true;

      // URL del Webhook Google Apps Script
      var webAppUrl = "https://script.google.com/macros/s/AKfycbzbfoE7huMaPtw_ecruZTTbB2IEV3mnnGfqudtkLEh8UreKw2nZHitnBml8M6TbKYrI/exec";

      var payload = {
        name: document.getElementById("nexus-name").value,
        phone: document.getElementById("nexus-phone").value,
        email: "N/A",
        city: "N/A"
      };

      fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(function() {
        // Genera un codice locale di conferma visiva
        var generatedCode = "NX-" + Math.floor(1000 + Math.random() * 9000);
        
        // Mostra la scheda del Certificato solo ora
        document.getElementById("nexus-code-display").innerText = generatedCode;
        document.getElementById("nexus-result").style.display = "block";
        
        // Ripristina il form
        btn.innerText = "CONFERMA & GENERA CERTIFICATO NEXUS";
        btn.disabled = false;
        document.getElementById("nexus-form").reset();
      })
      .catch(function(err) {
        alert("Errore durante l'invio. Riprova.");
        btn.innerText = "CONFERMA & GENERA CERTIFICATO NEXUS";
        btn.disabled = false;
      });
    });
  </script>

</body>
</html>
