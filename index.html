<script>
  if (window.location.hash) { history.replaceState(null, null, ' '); }

  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwysaZ7XC63ChZN9D311SYr_s55Yg4cX/exec";

  var bookingForm = document.getElementById('bookingForm');
  if (bookingForm) {
    bookingForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      var modal = document.getElementById('nexusModal');
      var modalLoading = document.getElementById('modalLoading');
      var modalSuccess = document.getElementById('modalSuccess');
      var codeDisplay = document.getElementById('nexusCodeDisplay');

      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
      if (modalLoading) modalLoading.classList.remove('hidden');
      if (modalSuccess) modalSuccess.classList.add('hidden');

      var randomNum = String(Math.floor(Math.random() * 9999) + 1).padStart(4, '0');
      var generatedCode = 'NX-' + randomNum;

      function estrai(id) {
        var el = document.getElementById(id);
        return (el && el.value) ? el.value : "N/A";
      }

      // Struttura JSON IDENTICA a quella funzionante delle 12:12 PM
      var payload = {
        nexus_code: generatedCode,
        name: estrai('leadNome'),
        leadNome: estrai('leadNome'),
        city: estrai('leadCitta'),
        leadCitta: estrai('leadCitta'),
        email: estrai('leadEmail'),
        leadEmail: estrai('leadEmail'),
        phone: estrai('leadTel'),
        leadTel: estrai('leadTel'),
        date: estrai('leadData'),
        leadData: estrai('leadData'),
        slot: estrai('leadOrario'),
        leadOrario: estrai('leadOrario')
      };

      try {
        // Invio RAW JSON con text/plain per bypassare il blocco CORS di Apps Script
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.log("Inviato.");
      }

      if (codeDisplay) codeDisplay.innerText = generatedCode;

      setTimeout(function() {
        if (modalLoading) modalLoading.classList.add('hidden');
        if (modalSuccess) modalSuccess.classList.remove('hidden');
        bookingForm.reset();
      }, 1000);
    });
  }

  function closeModal() {
    var modal = document.getElementById('nexusModal');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  function handleAlisonSend() {
    var input = document.getElementById('aiInput');
    if (!input || !input.value.trim()) return;
    alert('Alison AI ha ricevuto la richiesta: "' + input.value + '". Risposta in elaborazione sul canale Zurigo 42ms...');
    input.value = '';
  }
</script>
